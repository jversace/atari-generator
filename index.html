<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Atari Generator</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="tabBar">
    <button class="tab-button active" data-tab="body">🧍 <span data-i18n="tab.body"></span></button>
    <button class="tab-button" data-tab="hand">🖐️ <span data-i18n="tab.hand"></span></button>
  </div>

  <div id="app">
    <!-- Onglet Corps : structure inchangée depuis la version précédente. -->
    <div class="tab-panel" data-tab="body">
      <div id="viewport">
        <div id="fovOverlay">
          <label for="fovRange" data-i18n="panel.fov"></label>
          <input type="range" id="fovRange" min="20" max="90" step="1" value="45" />
          <span id="fovValue">45°</span>
        </div>
      </div>

      <aside id="panel">
        <div id="modeBar">
          <button id="btnEditMode" class="mode active" data-i18n="panel.mode.edit"></button>
          <button id="btnPoseMode" class="mode" data-i18n="panel.mode.pose"></button>
          <button id="btnSpineMode" class="mode" data-i18n="panel.mode.spine"></button>
        </div>

        <div id="poseHint" class="hint" hidden data-i18n-html="panel.hint.pose"></div>
        <div id="spineHint" class="hint" hidden data-i18n="panel.hint.spine"></div>

        <div id="controls"></div>

        <div id="fileBar">
          <button id="btnSave">💾 <span data-i18n="panel.file.saveBody"></span></button>
          <button id="btnLoad">📂 <span data-i18n="panel.file.load"></span></button>
          <button id="btnExport">🖼️ <span data-i18n="panel.file.export"></span></button>
          <button id="btnReset">↺ <span data-i18n="panel.file.reset"></span></button>
        </div>
      </aside>
    </div>

    <!-- Onglet Main : même principe, propre scène/caméra/panneau. -->
    <div class="tab-panel" data-tab="hand" hidden>
      <div id="handViewport">
        <div id="handFovOverlay" class="fov-overlay">
          <label for="handFovRange" data-i18n="panel.fov"></label>
          <input type="range" id="handFovRange" min="20" max="90" step="1" value="45" />
          <span id="handFovValue">45°</span>
        </div>
      </div>

      <aside id="handPanel" class="panel">
        <div id="handModeBar" class="mode-bar">
          <button id="btnHandEditMode" class="mode active" data-i18n="panel.mode.edit"></button>
          <button id="btnHandPoseMode" class="mode" data-i18n="panel.mode.pose"></button>
        </div>

        <button id="btnHandedness" class="handedness"></button>

        <div id="handPoseHint" class="hint" hidden data-i18n-html="panel.hint.pose.hand"></div>

        <div id="handControls"></div>

        <div class="file-bar">
          <button id="btnHandSave">💾 <span data-i18n="panel.file.saveHand"></span></button>
          <button id="btnHandLoad">📂 <span data-i18n="panel.file.load"></span></button>
          <button id="btnHandExport">🖼️ <span data-i18n="panel.file.export"></span></button>
          <button id="btnHandReset">↺ <span data-i18n="panel.file.reset"></span></button>
        </div>
      </aside>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.module.js",
      "three/examples/jsm/controls/OrbitControls.js": "./vendor/three/OrbitControls.js",
      "three/examples/jsm/controls/TransformControls.js": "./vendor/three/TransformControls.js"
    }
  }
  </script>
  <script type="module" src="./src/main-renderer.js"></script>
  <script type="module" src="./src/hand-renderer.js"></script>
</body>
</html>
